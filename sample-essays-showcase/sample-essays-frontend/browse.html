<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Essays - Sample Essays Showcase</title>
  <link rel="stylesheet" href="src/input.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="browse">
  <!-- Header -->
  <header class="sticky top-0 z-50 bg-white shadow-sm">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-lg flex items-center justify-center text-white font-bold">
          ✨
        </div>
        <span class="text-xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">
          Essays Showcase
        </span>
      </a>
      <nav class="hidden md:flex items-center gap-8">
        <a href="index.html" class="text-gray-600 hover:text-indigo-600 font-medium transition">Home</a>
        <a href="browse.html" class="text-indigo-600 font-medium">Browse</a>
      </nav>
    </div>
  </header>

  <!-- Browse Section -->
  <section class="max-w-6xl mx-auto px-6 py-12">
    <div class="mb-8">
      <h1 class="text-4xl font-bold mb-4">Browse Essays</h1>
      <p class="text-gray-600">Explore our complete collection of sample essays</p>
    </div>

    <!-- Search and Filters -->
    <div class="mb-8 space-y-4">
      <!-- Search Bar -->
      <div class="relative">
        <input 
          type="text" 
          id="search-input"
          placeholder="Search essays by title, author, or keywords..."
          class="w-full px-4 py-3 pr-12 border-2 border-gray-200 rounded-lg focus:border-indigo-500 focus:outline-none transition"
        >
        <button class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400">🔍</button>
      </div>

      <!-- Filters -->
      <div class="flex flex-wrap gap-4 items-center">
        <div class="flex items-center gap-2">
          <label for="category-filter" class="text-sm font-medium text-gray-700">Category:</label>
          <select id="category-filter" class="px-4 py-2 border-2 border-gray-200 rounded-lg focus:border-indigo-500 focus:outline-none">
            <option value="all">All Categories</option>
          </select>
        </div>

        <div class="flex items-center gap-2">
          <label for="sort-filter" class="text-sm font-medium text-gray-700">Sort:</label>
          <select id="sort-filter" class="px-4 py-2 border-2 border-gray-200 rounded-lg focus:border-indigo-500 focus:outline-none">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
            <option value="popular">Most Popular</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Essays Grid -->
    <div id="essays-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Essays will be inserted here -->
    </div>

    <!-- Loading State -->
    <div id="loading-state" class="text-center py-12">
      <p class="text-gray-500">Loading essays...</p>
    </div>

    <!-- No Results -->
    <div id="no-results" class="text-center py-12 hidden">
      <p class="text-gray-500 text-lg">No essays found. Try adjusting your search or filters.</p>
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-gray-900 text-gray-300 py-12 mt-20">
    <div class="max-w-6xl mx-auto px-6">
      <div class="border-t border-gray-800 pt-8 text-center text-sm">
        <p>&copy; 2024 Sample Essays Showcase. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
  <script>
    // Browse page specific initialization
    document.addEventListener('DOMContentLoaded', () => {
      loadEssays();
      loadCategoriesForFilter();
    });
  </script>
</body>
</html>
