<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Essay Detail - Sample Essays Showcase</title>
  <link rel="stylesheet" href="src/input.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="essay-detail">
  <!-- Header -->
  <header class="sticky top-0 z-50 bg-white shadow-sm">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-lg flex items-center justify-center text-white font-bold">
          ✨
        </div>
        <span class="text-xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">
          Essays Showcase
        </span>
      </a>
      <nav class="hidden md:flex items-center gap-8">
        <a href="index.html" class="text-gray-600 hover:text-indigo-600 font-medium transition">Home</a>
        <a href="browse.html" class="text-gray-600 hover:text-indigo-600 font-medium transition">Browse</a>
      </nav>
    </div>
  </header>

  <!-- Essay Content -->
  <article class="max-w-3xl mx-auto px-6 py-12">
    <!-- Back Button -->
    <a href="browse.html" class="inline-flex items-center gap-2 text-indigo-600 hover:text-indigo-700 mb-8 font-medium">
      ← Back to Essays
    </a>

    <!-- Essay Header -->
    <header class="mb-12">
      <div class="flex items-center gap-3 mb-4">
        <span id="essay-category" class="px-3 py-1 bg-indigo-100 text-indigo-700 rounded-full text-sm font-semibold"></span>
        <span id="essay-read-time" class="text-gray-500 text-sm">⏱ 8 min read</span>
      </div>
      <h1 id="essay-title" class="text-5xl font-bold mb-6 leading-tight"></h1>
      <div class="flex items-center justify-between text-gray-600">
        <div>
          <p id="essay-author" class="font-semibold text-lg mb-1"></p>
          <p id="essay-date" class="text-sm"></p>
        </div>
        <div class="text-right">
          <p class="text-2xl font-bold text-indigo-600" id="essay-views">0</p>
          <p class="text-sm text-gray-500">views</p>
        </div>
      </div>
    </header>

    <!-- Essay Content -->
    <div id="essay-content" class="prose prose-lg max-w-none mb-12">
      <!-- Content will be inserted here -->
    </div>

    <!-- Related Essays -->
    <section class="mt-16 pt-12 border-t border-gray-200">
      <h2 class="text-2xl font-bold mb-6">More Essays</h2>
      <div id="related-essays" class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Related essays will be inserted here -->
      </div>
    </section>
  </article>

  <!-- Footer -->
  <footer class="bg-gray-900 text-gray-300 py-12 mt-20">
    <div class="max-w-6xl mx-auto px-6">
      <div class="border-t border-gray-800 pt-8 text-center text-sm">
        <p>&copy; 2024 Sample Essays Showcase. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
  <script>
    // Load essay detail
    document.addEventListener('DOMContentLoaded', () => {
      loadEssayDetail();
    });
  </script>
</body>
</html>
